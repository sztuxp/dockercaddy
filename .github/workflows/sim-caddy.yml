name: Build and Push Caddy Multi-Arch Image

on:
  # 1. 当修改了 Dockerfile 或当前 yaml 文件并推送到主分支时自动触发
  #push:
  #  branches:
  #    - main
  #    - master
  #  paths:
  #    - 'Dockerfile'
  #    - '.github/workflows/docker-publish.yml'

  # 2. 支持在 GitHub Actions 页面手动触发，并可随时输入新的版本号
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'lxhao61/integrated-examples 的 Release 版本号'
        required: true
        default: '20261024'
        type: string

env:
  # 手动触发时使用输入的版本号；push 自动触发时默认使用 20261024
  RELEASE_TAG: ${{ inputs.release_tag || '20261024' }}

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: 4. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 5. Build and Push Docker Images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_TAG=${{ env.RELEASE_TAG }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/caddy:latest
            ${{ secrets.DOCKER_USERNAME }}/caddy:${{ env.RELEASE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
